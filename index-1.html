<!doctype html>
<html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Qala RP 3D</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9bc8e8;font-family:system-ui,Arial;touch-action:none}canvas{display:block}#hud{position:fixed;top:10px;left:10px;color:white;background:#101923d9;border:1px solid #ffffff35;border-radius:12px;padding:9px 12px;font-size:13px;z-index:2}#status{color:#a9f5c7;font-size:11px}#hint{position:fixed;top:10px;right:10px;max-width:48%;color:white;background:#101923d9;border-radius:12px;padding:9px;font-size:12px;text-align:center;z-index:2}#controls{position:fixed;inset:auto 0 18px 0;display:flex;justify-content:space-between;align-items:end;padding:0 18px;z-index:3;pointer-events:none}.pad{display:grid;grid-template-columns:58px 58px 58px;grid-template-rows:58px 58px;gap:5px;pointer-events:auto}.btn{background:#142334d9;border:2px solid #ffffff55;border-radius:16px;color:white;font-size:23px;font-weight:700;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;touch-action:none;box-shadow:0 3px 0 #0005}.btn.active{background:#2875bddd}.up{grid-column:2}.rightActions{display:flex;flex-direction:column;gap:10px;pointer-events:auto}.action{width:78px;height:58px;font-size:12px;line-height:1.1}#look{position:fixed;right:0;top:24%;width:46%;height:44%;z-index:1;touch-action:none}#desktop{position:fixed;bottom:6px;left:50%;transform:translateX(-50%);font-size:10px;color:#fff9;z-index:2}@media (pointer:fine){#controls{opacity:.75}}
</style></head><body><div id="hud"><b>🏙️ QALA RP 3D</b><br>💵 Ақша: <span id="money">2500</span> ₸<br>👥 Ойыншылар: <span id="players">1</span><br><span id="status">Серверге қосылмаған</span></div><div id="hint">Кейіпкер артынан көрінеді<br>Оң жақта экранды сүйреп камераны бұр</div><div id="look"></div><div id="controls"><div class="pad"><div class="btn up" data-key="forward">▲</div><div class="btn" data-key="left">◀</div><div class="btn" data-key="back">▼</div><div class="btn" data-key="right">▶</div></div><div class="rightActions"><div class="btn action" id="jump">СЕКІРУ</div><div class="btn action" id="work">ЖҰМЫС<br>+500 ₸</div></div></div><div id="desktop">Компьютерде: WASD / стрелкалар, тышқанмен камераны бұр</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9bc8e8);scene.fog=new THREE.Fog(0x9bc8e8,45,150);
const camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.1,300);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe7f5ff,0x68704b,2));const sun=new THREE.DirectionalLight(0xfff0d2,2.3);sun.position.set(-20,35,15);sun.castShadow=true;scene.add(sun);
const mat=(color,roughness=0.9)=>new THREE.MeshStandardMaterial({color,roughness});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(220,220),mat(0x65985a));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
// road grid
function road(x,z,w,d){const m=new THREE.Mesh(new THREE.BoxGeometry(w,.035,d),mat(0x3f4854));m.position.set(x,.02,z);scene.add(m);if(w>d){for(let i=-w/2+2;i<w/2-1;i+=4){const l=new THREE.Mesh(new THREE.BoxGeometry(1.6,.045,.13),mat(0xf3dfa0));l.position.set(x+i,.05,z);scene.add(l)}}else{for(let i=-d/2+2;i<d/2-1;i+=4){const l=new THREE.Mesh(new THREE.BoxGeometry(.13,.045,1.6),mat(0xf3dfa0));l.position.set(x,.05,z+i);scene.add(l)}}}
road(0,0,15,190);road(0,0,190,15);road(-48,38,15,100);road(45,-38,15,100);road(0,58,100,12);
function building(x,z,w,d,h,color){const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(color));b.position.set(x,h/2,z);b.castShadow=true;b.receiveShadow=true;scene.add(b);const winmat=mat(0xd5e7ec,.35);for(let y=2.5;y<h-1;y+=3){for(let xx=-w/2+1.3;xx<w/2-0.8;xx+=2.5){for(const side of [-1,1]){let win=new THREE.Mesh(new THREE.BoxGeometry(.9,1.15,.07),winmat);win.position.set(x+xx,y,z+side*(d/2+.04));scene.add(win)}}}}
const colors=[0xb7a4a0,0xaaaec4,0xc6c0ad,0x9eafb8,0xc8ad8d];for(let x=-70;x<=70;x+=27){for(let z=-70;z<=70;z+=28){if(Math.abs(x)<15||Math.abs(z)<15)continue;building(x,z,17,18,8+Math.random()*18,colors[Math.floor(Math.random()*colors.length)])}}
// trees
for(let x=-60;x<=60;x+=15)for(let z=-60;z<=60;z+=15){if(Math.abs(x)<14||Math.abs(z)<14)continue;let trunk=new THREE.Mesh(new THREE.CylinderGeometry(.25,.35,1.8,7),mat(0x765039));trunk.position.set(x,.9,z);scene.add(trunk);let crown=new THREE.Mesh(new THREE.SphereGeometry(1.35,9,7),mat(0x287a4b));crown.position.set(x,2.3,z);crown.castShadow=true;scene.add(crown)}
function makePlayer(color=0x2686df){const g=new THREE.Group();const body=new THREE.Mesh(new THREE.BoxGeometry(.75,1.05,.42),mat(color));body.position.y=1.15;body.castShadow=true;g.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.31,12,10),mat(0xe6b58c));head.position.y=1.95;head.castShadow=true;g.add(head);const legs=[];for(let x of [-.22,.22]){let leg=new THREE.Mesh(new THREE.BoxGeometry(.23,.65,.25),mat(0x26394f));leg.position.set(x,.48,0);g.add(leg);legs.push(leg)}const arms=[];for(let x of [-.52,.52]){let a=new THREE.Mesh(new THREE.BoxGeometry(.2,.75,.22),mat(0xe6b58c));a.position.set(x,1.2,0);g.add(a);arms.push(a)}g.userData={legs,arms};return g}
const player=makePlayer();player.position.set(0,0,4);scene.add(player);let yaw=0,pitch=.18,money=2500,walking=0;const keys={};let jumpY=0,jumpV=0;
const others=new Map();let ws=null;const params=new URLSearchParams(location.search);const server=params.get('server');if(server){try{ws=new WebSocket(server);ws.onopen=()=>{document.querySelector('#status').textContent='Онлайн серверге қосылды';ws.send(JSON.stringify({type:'join',x:player.position.x,z:player.position.z,rot:yaw}))};ws.onclose=()=>document.querySelector('#status').textContent='Сервер ажыратылды';ws.onerror=()=>document.querySelector('#status').textContent='Серверге қосылмады';ws.onmessage=e=>{let data;try{data=JSON.parse(e.data)}catch{return}if(data.type==='state'){const ids=new Set();for(const p of data.players){if(p.id===data.id)continue;ids.add(p.id);let o=others.get(p.id);if(!o){o=makePlayer(0xd54c58);scene.add(o);others.set(p.id,o)}o.position.set(p.x,0,p.z);o.rotation.y=p.rot||0}for(const [id,o] of others)if(!ids.has(id)){scene.remove(o);others.delete(id)}document.querySelector('#players').textContent=String(data.players.length)}}catch{document.querySelector('#status').textContent='Онлайн үшін сервер адресі керек'}}
function setKey(k,v,el){keys[k]=v;if(el)el.classList.toggle('active',v)}document.querySelectorAll('[data-key]').forEach(el=>{let k=el.dataset.key;el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture(e.pointerId);setKey(k,true,el)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(ev,()=>setKey(k,false,el))});addEventListener('keydown',e=>{const map={w:'forward',ArrowUp:'forward',s:'back',ArrowDown:'back',a:'left',ArrowLeft:'left',d:'right',ArrowRight:'right', ' ':'jump'};if(map[e.key]){keys[map[e.key]]=true;e.preventDefault()}});addEventListener('keyup',e=>{const map={w:'forward',ArrowUp:'forward',s:'back',ArrowDown:'back',a:'left',ArrowLeft:'left',d:'right',ArrowRight:'right',' ':'jump'};if(map[e.key])keys[map[e.key]]=false});
let lookDrag=null,lastX=0,lastY=0;const look=document.querySelector('#look');look.addEventListener('pointerdown',e=>{lookDrag=e.pointerId;lastX=e.clientX;lastY=e.clientY;look.setPointerCapture(e.pointerId)});look.addEventListener('pointermove',e=>{if(lookDrag!==e.pointerId)return;yaw-=(e.clientX-lastX)*.008;pitch=THREE.MathUtils.clamp(pitch+(e.clientY-lastY)*.005,-.15,.8);lastX=e.clientX;lastY=e.clientY});for(const ev of ['pointerup','pointercancel','lostpointercapture'])look.addEventListener(ev,()=>lookDrag=null);
document.querySelector('#jump').addEventListener('pointerdown',e=>{e.preventDefault();if(player.position.y<=.001)jumpV=5.5});document.querySelector('#work').addEventListener('pointerdown',e=>{e.preventDefault();money+=500;document.querySelector('#money').textContent=money;document.querySelector('#work').textContent='АЛЫНДЫ!';setTimeout(()=>document.querySelector('#work').innerHTML='ЖҰМЫС<br>+500 ₸',700)});
let lastSend=0;function animate(t){requestAnimationFrame(animate);const dt=Math.min(.04,(t-(animate.last||t))/1000);animate.last=t;let f=(keys.forward?1:0)-(keys.back?1:0),s=(keys.right?1:0)-(keys.left?1:0);const moving=Math.abs(f)+Math.abs(s)>0;const speed=keys.run?9:5.2;if(moving){const dir=yaw;player.position.x+=(-Math.sin(dir)*f+Math.cos(dir)*s)*speed*dt;player.position.z+=(-Math.cos(dir)*f-Math.sin(dir)*s)*speed*dt;player.rotation.y=yaw+Math.atan2(s,f||.0001);walking+=dt*10;player.userData.legs[0].rotation.x=Math.sin(walking)*.65;player.userData.legs[1].rotation.x=-Math.sin(walking)*.65;player.userData.arms[0].rotation.x=-Math.sin(walking)*.45;player.userData.arms[1].rotation.x=Math.sin(walking)*.45}else{player.userData.legs.forEach(l=>l.rotation.x=0);player.userData.arms.forEach(a=>a.rotation.x=0)}jumpV-=14*dt;jumpY=Math.max(0,jumpY+jumpV*dt);if(jumpY===0)jumpV=0;player.position.y=jumpY;
const target=new THREE.Vector3(player.position.x,1.45+player.position.y,player.position.z);const dist=6.5;const offset=new THREE.Vector3(Math.sin(yaw)*Math.cos(pitch)*dist,2.2+pitch*3,Math.cos(yaw)*Math.cos(pitch)*dist);camera.position.copy(target).add(offset);camera.lookAt(target);
if(ws&&ws.readyState===1&&t-lastSend>100){ws.send(JSON.stringify({type:'move',x:player.position.x,z:player.position.z,rot:player.rotation.y}));lastSend=t}renderer.render(scene,camera)}requestAnimationFrame(animate);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
